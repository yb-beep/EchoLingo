<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>听透 · 手机预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#eaf0fa; font-family:"Microsoft YaHei",sans-serif; color:#172a49; }
    main { min-height:100dvh; display:flex; justify-content:center; align-items:center; padding:12px; }
    iframe { width:390px; max-width:100%; height:calc(100dvh - 24px); max-height:900px; border:0; border-radius:22px; background:white; box-shadow:0 16px 45px #274d8726; }
    @media(max-width:450px) { main { padding:0; } iframe { width:100%; max-width:none; height:100dvh; max-height:none; border-radius:0; box-shadow:none; } }
  </style>
</head>
<body><main><iframe src="/" title="听透手机界面预览"></iframe></main></body>
</html>
