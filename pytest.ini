[pytest]
testpaths = tests
addopts = -p no:cacheprovider --ignore=tests/test_ipa.py --ignore=tests/test_merge.py
markers =
    contract: 只校验 HTTP 形状与 fixtures 一致性，不改服务状态，任一环境可先跑
    flow: 依赖服务端会话状态（交卷/标记/带练/复习），Mock 与真实服务都应通过
    fault: 依赖故障注入（慢响应/错误/过期/重复），真实服务上按能力自动跳过
    concurrent: 并发请求下的一致性（幂等计数、唯一 ID、状态自洽），压出来的问题
